<ion-header class="ion-no-border">
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-icon name="hardware-chip-outline" class="header-icon"></ion-icon>
    </ion-buttons>

    <ion-title>Control</ion-title>

    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="radio-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="control-container">

    <h3 class="section-title">All Controls</h3>

    <div class="actions-grid">

      <!-- Row 1 -->
      <ion-button
        fill="clear"
        (click)="executeSystemCommand('shutdown')"
        [disabled]="isExecuting"
      >
        <div class="action-content">
          <ion-icon name="power-outline"></ion-icon>
          <span>Shutdown</span>
        </div>
      </ion-button>

      <ion-button
        fill="clear"
        (click)="executeSystemCommand('lock')"
        [disabled]="isExecuting"
      >
        <div class="action-content">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <span>Lock</span>
        </div>
      </ion-button>

      <!-- Row 2 -->
      <ion-button
        fill="clear"
        (click)="executeSystemCommand('sleep')"
        [disabled]="isExecuting"
      >
        <div class="action-content">
          <ion-icon name="moon-outline"></ion-icon>
          <span>Sleep</span>
        </div>
      </ion-button>

      <ion-button
        fill="clear"
        (click)="executeSystemCommand('restart')"
        [disabled]="isExecuting"
      >
        <div class="action-content">
          <ion-icon name="refresh-outline"></ion-icon>
          <span>Restart</span>
        </div>
      </ion-button>

      <!-- Row 3 -->
      <ion-button
        fill="clear"
        (click)="openChrome()"
        [disabled]="isExecuting"
      >
        <div class="action-content">
          <ion-icon name="globe-outline"></ion-icon>
          <span>{{ activeApp === 'chrome' ? 'Working...' : 'Browser' }}</span>
        </div>
      </ion-button>

      <ion-button
        fill="clear"
        (click)="openNotepad()"
        [disabled]="isExecuting"
      >
        <div class="action-content">
          <ion-icon name="document-text-outline"></ion-icon>
          <span>{{ activeApp === 'notepad' ? 'Working...' : 'Notepad' }}</span>
        </div>
      </ion-button>

      <!-- Row 4 -->
      <ion-button
        class="full-width"
        fill="clear"
        (click)="openVSCode()"
        [disabled]="isExecuting"
      >
        <div class="action-content">
          <ion-icon name="code-slash-outline"></ion-icon>
          <span>{{ activeApp === 'vscode' ? 'Working...' : 'VS Code' }}</span>
        </div>
      </ion-button>

    </div>

  </div>

</ion-content>

<ion-footer class="ion-no-border">

  <div class="bottom-nav">

    <button class="nav-item" type="button" (click)="onNavClick('dashboard')">
      <ion-icon name="grid-outline"></ion-icon>
      <span>Dashboard</span>
    </button>

    <button class="nav-item" type="button" (click)="onNavClick('ai-chat')">
      <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
      <span>AI Chat</span>
    </button>

    <button class="nav-item active" type="button" (click)="onNavClick('control')">
      <ion-icon name="apps-outline"></ion-icon>
      <span>Control</span>
    </button>

    <button class="nav-item" type="button" (click)="onNavClick('history')">
      <ion-icon name="time-outline"></ion-icon>
      <span>History</span>
    </button>

    <button class="nav-item" type="button" (click)="onNavClick('settings')">
      <ion-icon name="settings-outline"></ion-icon>
      <span>Settings</span>
    </button>

  </div>

</ion-footer>
