<ion-content [fullscreen]="true" class="splash-page">

  <div class="splash-container">

    <!-- Application Logo -->
    <div class="logo-wrapper">
      <div class="logo-circle">
        <ion-icon name="desktop-outline"></ion-icon>
      </div>
    </div>

    <!-- Application Name -->
    <h1>AI Desktop Controller</h1>

    <p class="tagline">
      Mobile-Based Desktop Automation
    </p>

    <!-- Loading Indicator -->
    <div class="loading-section">

      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>

      <p>Initializing...</p>

    </div>

    <!-- Version -->
    <span class="version">
      Version 1.0.0
    </span>

  </div>

</ion-content>
