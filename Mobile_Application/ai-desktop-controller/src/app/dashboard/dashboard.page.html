<ion-header class="ion-no-border">
  <ion-toolbar>

    <ion-title>Dashboard</ion-title>

    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="dashboard-container">

    <div class="welcome-section">

      <h2>Good Morning 👋</h2>

      <p>Desktop Controller</p>

    </div>

    <div class="device-card">

      <div class="status">

        <span class="status-dot"></span>

        Connected

      </div>

      <h3>DESKTOP-PC</h3>

      <p>Windows 11</p>

    </div>

    <h3 class="section-title">Quick Actions</h3>

    <div class="actions-grid">

      <ion-button fill="clear">🖱<br>Mouse</ion-button>

      <ion-button fill="clear">⌨<br>Keyboard</ion-button>

      <ion-button fill="clear">📁<br>Files</ion-button>

      <ion-button fill="clear">🌐<br>Browser</ion-button>

      <ion-button fill="clear">🎵<br>Media</ion-button>

      <ion-button fill="clear">⚙<br>Settings</ion-button>

    </div>

  </div>

</ion-content>
